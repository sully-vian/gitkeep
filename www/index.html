<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lib/github.min.css">
    <script src="lib/marked.umd.js"></script>
    <script src="lib/highlight.min.js"></script>
    <script src="lib/marked-highlight.umd.js"></script>
    <script src="mock-gitsync.js"></script>
    <script src="app.js"></script>
    <script src="lib/alpine.min.js" defer></script>
</head>

<body x-data="gitkeep">
    <main x-show="current === null">
        <header>
            <button type="button" @click="create()">New</button>
        </header>
        <p x-show="notes.length === 0">No notes.</p>
        <ul>
            <template x-for="note in notes" :key="note.path">
                <li><button type="button" @click="open(note)" x-text="note.path"></button></li>
            </template>
        </ul>
    </main>

    <template x-if="current !== null">
        <main>
            <header>
                <button type="button" @click="close()">Back</button>
                <span x-text="current.path"></span>
                <button type="button" @click="preview = !preview" x-text="preview ? 'Edit' : 'Preview'"></button>
                <button type="button" @click="remove()">Delete</button>
            </header>
            <textarea x-show="!preview" x-model="current.content" @input.debounce.1000ms="save()"></textarea>
            <article x-show="preview" x-html="html"></article>
        </main>
    </template>
</body>

</html>
