plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.sully_vian.gitkeep'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.sully_vian.gitkeep'
        minSdk = 26 // Android 8.0: java.nio.file (JGit) and java.time are available
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

/**
 * Copies the top-level fixtures/ notes into a generated folder, as assets/fixtures/
 * of the APK. Registered for debug builds only (below), so release builds never
 * contain them.
 */
abstract class FixtureAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getFixtures()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFiles()

    @TaskAction
    void copy() {
        files.sync {
            from(fixtures) { include '*.md' }
            into(outputDir.dir('fixtures'))
        }
    }
}

def fixtureAssets = tasks.register('fixtureAssets', FixtureAssets) {
    fixtures = rootProject.layout.projectDirectory.dir('fixtures')
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(fixtureAssets) { it.outputDir }
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
}
